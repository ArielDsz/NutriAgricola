spring.application.name=registros
server.port=${SERVER_PORT:8082}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nutri_records_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=registros

spring.flyway.enabled=true
spring.flyway.schemas=registros
spring.flyway.default-schema=registros
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration,classpath:db/demo

services.users.url=${USERS_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.users-service.connectTimeout=2000
# La consulta del perfil usa PostgreSQL remoto; permite su latencia antes de devolver 503.
spring.cloud.openfeign.client.config.users-service.readTimeout=10000

storage.photos.directory=${PHOTO_STORAGE_DIR:storage/foliar-photos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Limita las conexiones de cada servicio al usar el Session pooler compartido.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
