spring.application.name=registros
server.port=${SERVER_PORT:8082}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nutri_records_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=registros

spring.flyway.enabled=true
spring.flyway.schemas=registros
spring.flyway.default-schema=registros
spring.flyway.create-schemas=true

services.users.url=${USERS_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.users-service.connectTimeout=2000
spring.cloud.openfeign.client.config.users-service.readTimeout=3000
