spring.application.name=registros-test

spring.datasource.url=jdbc:h2:mem:registros_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=registros

spring.flyway.enabled=true
spring.flyway.schemas=registros
spring.flyway.default-schema=registros
spring.flyway.create-schemas=true
